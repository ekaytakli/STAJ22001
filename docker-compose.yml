services:
  postgres:
    image: postgres:16-alpine
    container_name: todoapp-postgres
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD ortam değişkeni zorunludur}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: todoapp-backend
    depends_on:
      - postgres
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/todo_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD ortam değişkeni zorunludur}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET ortam değişkeni zorunludur}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: todoapp-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
