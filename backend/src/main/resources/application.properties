spring.application.name=todoapp
# Sunucumuzun çalışacağı port
server.port=${PORT:8080}
# Localhost üzerindeki 5432 portunda çalışan PostgreSQL'e ve todo_db veritabanına erişim adresi
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/todo_db}

spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Flyway şemayı günceller; Hibernate yalnızca entity uyumunu doğrular.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=0
#Arka planda Hibernate tarafından çalıştırılan SQL sorgularını terminalde gösterir
spring.jpa.show-sql=true
# Terminalde görünen SQL sorgularını okunabilir olması için alt alta ve düzenli formatlar
spring.jpa.properties.hibernate.format_sql=true
# Hibernate'e PostgreSQL diyalekti/dili kullandığımızı belirten ayar
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
spring.jackson.deserialization.fail-on-null-for-primitives=false
